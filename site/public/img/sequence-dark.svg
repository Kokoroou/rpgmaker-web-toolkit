d="M276 274 L386 274" fill="none" stroke="#8a8a92" stroke-width="1.4" marker-end="url(#ah)"/><text class="s" x="64" y="302">plugins.js with this player's settings</text><path d="M276 308 L56 308" fill="none" stroke="#8a8a92" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="12" y="330" width="418" height="22" rx="5" fill="#2a2a2f" stroke="#8a8a92" stroke-width="1"/><text class="s m" x="221" y="345">Service Worker starts keeping files in the cache</text><rect x="8" y="366" width="424" height="22" rx="5" fill="#232327"/><text class="z" x="18" y="382">Save sync</text><text class="s" x="64" y="406">GET /api/saves</text><path d="M56 412 L276 412" fill="none" stroke="#8a8a92" stroke-width="1.4" marker-end="url(#ah)"/><text class="s" x="284" y="440">list this player's saves</text><path d="M276 446 L386 446" fill="none" stroke="#8a8a92" stroke-width="1.4" marker-end="url(#ah)"/><text class="s" x="64" y="474">names + ETags; keep the newer, ask if both changed</text><path d="M276 480 L56 480" fill="none" stroke="#8a8a92" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><text class="s" x="64" y="508">PUT /api/saves/file1, If-Match: ETag</text><path d="M56 514 L276 514" fill="none" stroke="#8a8a92" stroke-width="1.4" marker-end="url(#ah)"/><text class="s" x="284" y="542">history copy, then write</text><path d="M276 548 L386 548" fill="none" stroke="#8a8a92" stroke-width="1.4" marker-end="url(#ah)"/><text class="s" x="64" y="576">200 + new ETag, or 412 conflict</text><path d="M276 582 L56 582" fill="none" stroke="#8a8a92" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
</svg>
