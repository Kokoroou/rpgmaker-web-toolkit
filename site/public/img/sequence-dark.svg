<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 606" role="img" aria-labelledby="t d">
<title id="t">First load and save sync</title>
<desc id="d">Two phases between the browser, Cloudflare Access, the Worker and R2. First load: the browser opens the site, Access shows a login page and sets a signed cookie, then the browser fetches the page and game files through Access from the Worker, which serves large files from R2. The Worker reads js/plugins.js and adds the settings it reads from R2 for this player, and the Service Worker starts keeping files in the cache. Save sync: the browser lists saves, and the Worker reads R2 and returns names and ETags so the plugin keeps the newer copy or asks when both changed. Each save uploads about a second later with If-Match; the Worker copies the old save to history, writes the new one, and answers with a new ETag or a 412 conflict.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8a8a92"/></marker>
</defs>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#f0f0f2;font-size:13px}
.s{fill:#b4b4bb;font-size:11.5px}.b{font-weight:600}.z{font-size:12px;font-weight:600;fill:#b4b4bb;letter-spacing:.02em}
.m{text-anchor:middle}.e{text-anchor:end}
</style>
<rect width="440" height="606" fill="#1b1b1f"/>
