# Checks every week that the Cloudflare Workers API still takes what
# update-from-link sends (cli/lib/workers-api.js). A failed run means the
# command may no longer work: GitHub emails the repository owner.
name: Workers API

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["cli/lib/workers-api.js", "scripts/check-workers-api.js", ".github/workflows/workers-api.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: node scripts/check-workers-api.js
